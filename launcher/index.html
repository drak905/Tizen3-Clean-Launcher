<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
  <title>Home</title>
  <!-- Look and assets adapted from CleanFrame (https://github.com/nthnclrk/CleanFrame, MIT). See licenses/. -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="stage" id="stage">
    <!-- Photograph (two layers for a crossfade) + CleanFrame's top shade and bottom scrim -->
    <div class="bg" aria-hidden="true">
      <div class="photo" id="photoA"></div>
      <div class="photo" id="photoB"></div>
      <div class="shade"></div>
      <div class="scrim"></div>
    </div>

    <div class="caption"><span class="clock" id="clock">9:41</span></div>

    <!-- Frosted lens behind the focused top-right control (pre-rendered blur, no live filter) -->
    <div class="lens" id="lens" aria-hidden="true"><div class="lens-img" id="lensImg"></div><div class="lens-veil"></div></div>
    <nav class="utils" id="utils" aria-label="Home controls"></nav>

    <!-- Glass dock: pre-rendered "soft" material clipped to the dock -->
    <section class="dock" id="dock" aria-label="Apps">
      <div class="mat" aria-hidden="true"><div class="mat-img" id="matImg"></div><div class="mat-scrim"></div><div class="mat-veil"></div></div>
      <div class="shelf" id="shelf"><div class="track" id="track"><div class="plate" id="plate"></div></div></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <pre class="debug" id="debug" aria-hidden="true"></pre>
  </main>

  <script src="assets/catalog.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
